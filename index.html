<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - To-Do List</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/priority.css">
  <link rel="stylesheet" href="css/duedate.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/filter.css">
  <link rel="stylesheet" href="css/progress.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1>TaskFlow</h1>
        <p class="tagline" id="tagline">Plan your day, one task at a time.</p>
      </div>
      <div id="header-actions" class="header-actions"></div>
    </header>

    <section id="progress" class="progress-slot"></section>

    <form id="task-form" class="task-form" autocomplete="off">
      <div class="task-form-row">
        <input type="text" id="task-input" placeholder="What needs to be done?" maxlength="120" required aria-label="Task title">
        <button type="submit" class="btn-primary">Add task</button>
      </div>
      <div id="form-extras" class="form-extras"></div>
    </form>

    <section id="toolbar" class="toolbar"></section>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-state" class="empty-state" hidden></p>
  </main>

  <footer class="app-footer">Built by Bhabya and Nandani</footer>

  <script src="js/storage.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/priority.js"></script>
  <script src="js/duedate.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/search.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
